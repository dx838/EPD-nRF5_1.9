name: BuildAndPush

on:
  # push:
  workflow_dispatch:

jobs:
  nrf51:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        id: arm-none-eabi-gcc-action
        with:
          release: '4.9-2015-q3'
      - name: Build
        run: |
          gcc_path=${{ steps.arm-none-eabi-gcc-action.outputs.path }}
          sudo ln -s `dirname ${gcc_path}` /usr/local/gcc-arm-none-eabi-4_9-2015q3
          cp Makefile.nRF51 Makefile
          make
      - uses: actions/upload-artifact@v4
        with:
          name: nrf51822_xxaa
          path: |
            _build/nrf51822_xxaa.hex
            SDK/12.3.0_d7731ad/components/softdevice/s130/hex/s130_nrf51_2.0.1_softdevice.hex
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          # 上传构建产物（支持通配符、多行）
          files: |
            nrf51822_xxaa
          # 自动生成变更日志（基于标签间的提交）
          generate_release_notes: true
          # 可选：是否为预发布
          prerelease: false
          # 可选：是否为草稿
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  nrf52:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ARM GCC
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        id: arm-none-eabi-gcc-action
        with:
          release: '9-2020-q2'
      - name: Build
        run: |
          gcc_path=${{ steps.arm-none-eabi-gcc-action.outputs.path }}
          sudo ln -s `dirname ${gcc_path}` /usr/local/gcc-arm-none-eabi-9-2020-q2-update
          cp Makefile.nRF52 Makefile
          make
      - uses: actions/upload-artifact@v4
        with:
          name: nrf52811_xxaa
          path: |
            _build/nrf52811_xxaa.hex
            SDK/17.1.0_ddde560/components/softdevice/s112/hex/s112_nrf52_7.2.0_softdevice.hex
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          # 上传构建产物（支持通配符、多行）
          files: |
            nrf52811_xxaa
          # 自动生成变更日志（基于标签间的提交）
          generate_release_notes: true
          # 可选：是否为预发布
          prerelease: false
          # 可选：是否为草稿
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  win32:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
      - name: Build
        run: make -f Makefile.win32
      - uses: actions/upload-artifact@v4
        with:
          name: emulator
          path: emulator.exe
      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          # 上传构建产物（支持通配符、多行）
          files: |
            emulator.exe
          # 自动生成变更日志（基于标签间的提交）
          generate_release_notes: true
          # 可选：是否为预发布
          prerelease: false
          # 可选：是否为草稿
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
